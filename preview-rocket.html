<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rocket preview</title>
  <style>
    body { background: #0d0d2b; color: #e0e0e0; font-family: sans-serif; padding: 20px; }
    h1 { font-size: 1.2rem; }
    #board { position: relative; width: 400px; height: 400px; background: #1a1a3a; border: 2px solid #2a2a4e; }
    #board canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    p { margin-top: 12px; max-width: 400px; font-size: 0.9rem; color: #888; }
  </style>
</head>
<body>
  <h1>Rocket on board (preview)</h1>
  <p>This is how one rocket is drawn: fixed-size body (correct aspect ratio), exhaust length matches path. Open this file in a browser to check.</p>
  <div id="board">
    <canvas id="c"></canvas>
  </div>

  <script>
    const ROCKET_BODY_FRAC = 0.35;
    const ROCKET_BODY_DISPLAY_H = 56;

    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = function() {
      const w = img.naturalWidth;
      const h = img.naturalHeight;
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0);
      const data = ctx.getImageData(0, 0, w, h);
      const d = data.data;
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i + 1], b = d[i + 2];
        const sum = r + g + b;
        const isDarkBlue = (r < 110 && g < 110 && b > 60) || (sum < 140 && b > r && b > g);
        const isVeryDark = sum < 90;
        if (isDarkBlue || isVeryDark) d[i + 3] = 0;
      }
      ctx.putImageData(data, 0, 0);
      const rocket = canvas;

      const board = document.getElementById("c");
      board.width = 400;
      board.height = 400;
      const bctx = board.getContext("2d");

      // Simulate: from = lower (e.g. square 5), to = higher (e.g. square 50). a = launch, b = destination.
      const a = { x: 200, y: 320 };
      const b = { x: 200, y: 80 };
      const pathLen = Math.hypot(b.x - a.x, b.y - a.y);
      const bodyHImg = ROCKET_BODY_FRAC * h;
      const exhaustHImg = h - bodyHImg;
      const bodyDispH = ROCKET_BODY_DISPLAY_H;
      const bodyDispW = bodyDispH * (w / bodyHImg);
      const exhaustDispW = bodyDispW;
      const exhaustLen = Math.max(20, pathLen - bodyDispH);
      const angle = Math.atan2(b.x - a.x, a.y - b.y);

      bctx.fillStyle = "#1a1a3a";
      bctx.fillRect(0, 0, 400, 400);

      bctx.save();
      bctx.translate(b.x, b.y);
      bctx.rotate(angle);
      bctx.drawImage(rocket, 0, bodyHImg, w, exhaustHImg, -exhaustDispW / 2, 0, exhaustDispW, exhaustLen);
      bctx.restore();

      bctx.save();
      bctx.translate(b.x, b.y);
      bctx.rotate(angle);
      bctx.drawImage(rocket, 0, 0, w, bodyHImg, -bodyDispW / 2, -bodyDispH, bodyDispW, bodyDispH);
      bctx.restore();

      bctx.beginPath();
      bctx.arc(a.x, a.y, 7, 0, Math.PI * 2);
      bctx.fillStyle = "#34495e";
      bctx.fill();
      bctx.strokeStyle = "#2c3e50";
      bctx.lineWidth = 2;
      bctx.stroke();
    };
    img.onerror = function() { document.body.appendChild(document.createTextNode("Could not load assets/rocket.png")); };
    img.src = "assets/rocket.png";
  </script>
</body>
</html>

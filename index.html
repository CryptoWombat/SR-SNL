<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Race: Snakes &amp; Ladders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=14">
</head>
<body>
  <div id="stars"></div>
  <div id="stars2"></div>

  <header>
    <h1>SPACE RACE <span class="heading-sub">- Rockets and Meteors</span></h1>
  </header>

  <main class="game-container">
    <div class="board-wrapper">
      <div class="board-container">
        <div id="board" class="board-grid"></div>
        <canvas id="connections-canvas"></canvas>
        <div id="player-tokens"></div>
      </div>
    </div>

    <aside class="side-panel">
      <section class="dice-section">
        <h2 id="mission-control-title">MISSION CONTROL</h2>
        <div class="current-turn">
          <span id="turn-indicator" class="turn-ussr">USSR's Turn</span>
        </div>
        <div class="dice-area">
          <div id="dice" class="dice">?</div>
          <button id="roll-btn" class="btn btn-roll">LAUNCH DICE</button>
        </div>
        <div class="player-status">
          <div class="player-card ussr-card">
            <span class="player-ship" aria-hidden="true">
              <svg viewBox="0 0 28 40" xmlns="http://www.w3.org/2000/svg" class="ship-svg ship-ussr">
                <defs>
                  <linearGradient id="rocket-body-ussr" x1="14" y1="40" x2="14" y2="0"><stop offset="0" stop-color="#c0392b"/><stop offset="1" stop-color="#e74c3c"/></linearGradient>
                </defs>
                <path d="M14 0 L24 8 L24 20 L28 28 L24 26 L14 34 L4 26 L0 28 L4 20 L4 8 Z" fill="#2c3e50"/>
                <rect x="2" y="20" width="24" height="8" rx="1" fill="url(#rocket-body-ussr)"/>
                <rect x="4" y="8" width="20" height="4" fill="#e67e22"/>
                <circle cx="14" cy="24" r="4" fill="#2c3e50"/>
                <circle cx="14" cy="24" r="2.5" fill="#e74c3c"/>
                <circle cx="13" cy="23" r="0.8" fill="rgba(255,255,255,0.7)"/>
                <path d="M4 26 L0 36 L4 32 L4 26 M24 26 L28 36 L24 32 L24 26" fill="#2c3e50"/>
                <rect x="6" y="32" width="16" height="4" fill="#2c3e50"/>
                <rect x="8" y="34" width="12" height="3" fill="#e74c3c"/>
                <path d="M14 37 L18 32 L16 37 L14 40 L12 37 L10 32 Z" fill="#f1c40f"/>
              </svg>
            </span>
            <span class="player-name">USSR</span>
            <span class="player-pos" id="ussr-pos">Square: 1</span>
          </div>
          <div class="player-card usa-card">
            <span class="player-ship" aria-hidden="true">
              <svg viewBox="0 0 28 40" xmlns="http://www.w3.org/2000/svg" class="ship-svg ship-usa">
                <defs>
                  <linearGradient id="rocket-body-usa" x1="14" y1="40" x2="14" y2="0"><stop offset="0" stop-color="#2471a3"/><stop offset="1" stop-color="#3498db"/></linearGradient>
                </defs>
                <path d="M14 0 L24 8 L24 20 L28 28 L24 26 L14 34 L4 26 L0 28 L4 20 L4 8 Z" fill="#2c3e50"/>
                <rect x="2" y="20" width="24" height="8" rx="1" fill="url(#rocket-body-usa)"/>
                <rect x="4" y="8" width="20" height="4" fill="#e67e22"/>
                <circle cx="14" cy="24" r="4" fill="#2c3e50"/>
                <circle cx="14" cy="24" r="2.5" fill="#3498db"/>
                <circle cx="13" cy="23" r="0.8" fill="rgba(255,255,255,0.7)"/>
                <path d="M4 26 L0 36 L4 32 L4 26 M24 26 L28 36 L24 32 L24 26" fill="#2c3e50"/>
                <rect x="6" y="32" width="16" height="4" fill="#2c3e50"/>
                <rect x="8" y="34" width="12" height="3" fill="#e74c3c"/>
                <path d="M14 37 L18 32 L16 37 L14 40 L12 37 L10 32 Z" fill="#f1c40f"/>
              </svg>
            </span>
            <span class="player-name">USA</span>
            <span class="player-pos" id="usa-pos">Square: 1</span>
          </div>
        </div>
      </section>

      <!-- Hidden elements for game.js compatibility -->
      <div style="display:none;">
        <button class="tab-btn active" data-tab="rocket"></button>
        <button class="tab-btn" data-tab="meteor"></button>
        <div id="rocket-form"></div>
        <div id="meteor-form" class="hidden"></div>
        <input id="rocket-from"><input id="rocket-to">
        <input id="meteor-from"><input id="meteor-to">
        <button id="add-rocket-btn"></button>
        <button id="add-meteor-btn"></button>
        <div id="connections-list-content"></div>
      </div>

      <section class="legend-section">
        <h2 id="legend-title">LEGEND</h2>
        <div class="legend-items">
          <div class="legend-item"><span class="legend-swatch swatch-ussr"></span> USSR</div>
          <div class="legend-item"><span class="legend-swatch swatch-usa"></span> USA</div>
          <div class="legend-item"><span class="legend-swatch swatch-neutral"></span> Neutral</div>
        </div>
      </section>

      <button id="reset-btn" class="btn btn-reset">NEW GAME</button>
    </aside>
  </main>

  <div id="tooltip" class="tooltip hidden"></div>
  <div id="winner-overlay" class="winner-overlay hidden">
    <div class="winner-content">
      <h2 id="winner-text"></h2>
      <p id="winner-sub"></p>
      <button id="play-again-btn" class="btn btn-roll" onclick="game.reset()">PLAY AGAIN</button>
    </div>
  </div>

  <script src="game.js?v=15"></script>
</body>
</html>
